services:
  mocopi-posture:
    image: mocopi-app:v1
    ports:
      - "8002:8002/tcp"
      - "8765:8765/tcp"
      - "12351:12351/udp"
    environment:
      HTTP_PORT: "8002"
      WS_PORT: "8765"
      MOCOPI_PORT: "12351"
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - mocopi-profile:/data
    restart: unless-stopped

volumes:
  mocopi-profile:
